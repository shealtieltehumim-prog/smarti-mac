name: macOS build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        os: [macos-14, macos-15-intel]   # Apple Silicon and Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: brew install portaudio
      - name: Build app and DMG
        run: scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SmartiAI-macOS-${{ matrix.os }}
          path: dist/*.dmg
