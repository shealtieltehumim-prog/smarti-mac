name: macOS build

on:
  workflow_dispatch:
    inputs:
      runners:
        description: 'JSON list of runners (macos-15 = Apple Silicon, macos-15-intel = Intel)'
        default: '["macos-15", "macos-15-intel"]'
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event.inputs.runners || '["macos-15", "macos-15-intel"]') }}   # Apple Silicon and Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: brew install portaudio uv
      - name: Build app and DMG
        run: scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SmartiAI-macOS-${{ matrix.os }}
          path: dist/*.dmg
